events {}
http {
  # Header-tolerant reverse proxy in front of the RabbitMQ management UI.
  #
  # The KodeKloud port-proxy domain sets large session cookies; the browser sends
  # them all with every request, overflowing RabbitMQ's embedded web server (Cowboy)
  # default per-header limit and returning HTTP 431 ("Request Header Fields Too
  # Large"). We accept the big cookies here, then strip them before forwarding — the
  # management UI authenticates with HTTP Basic auth, not those cookies, so dropping
  # them is safe. Basic auth (the Authorization header) passes straight through.
  server {
    listen 15672;
    large_client_header_buffers 8 64k;
    client_header_buffer_size 64k;
    location / {
      # Resolve the upstream at request time (via Docker's DNS) so nginx starts even
      # if rabbitmq isn't resolvable yet.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $upstream rabbitmq;
      proxy_pass http://$upstream:15672;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Cookie "";
    }
  }
}
