services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [notifications]

  # Header-tolerant proxy for the management UI (works around HTTP 431 from the
  # platform's large cookies). Admin tool — kept off the public internet.
  mgmt-proxy:
    image: nginx:alpine
    container_name: mgmt-proxy
    restart: unless-stopped
    depends_on:
      - rabbitmq
    ports:
      - "127.0.0.1:15672:15672"   # tunnel in, don't expose publicly
    volumes:
      - ./mgmt-proxy.conf:/etc/nginx/nginx.conf:ro
    networks: [notifications]

  # Express HTTP API: POST /notify queues one event, fanned out to
  # notify.push + notify.email. Not published to the host — only the
  # dashboard (over the Docker network) and docker compose exec reach it.
  producer:
    build: ./app
    container_name: producer
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      SERVICE_NAME: producer
      RABBITMQ_HOST: rabbitmq
      REDISHOST: redis
      PORT: "3000"
    command: ["node", "src/producer/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [notifications, backend-net]

  push-worker:
    build: ./app
    container_name: push-worker
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      SERVICE_NAME: push-worker
      RABBITMQ_HOST: rabbitmq
      REDISHOST: redis
      CHANNEL: push
      PORT: "3000"
      # Startup defaults only (seeded into Redis lab:flags if unset). The
      # dashboard toggles both flags at runtime for every worker — no recreate.
      IDEMPOTENCY_ENABLED: "false"
      CLAIM_LEASE_ENABLED: "false"
    # The crash task makes this worker exit on purpose; Docker brings it back so
    # RabbitMQ can redeliver the un-acked message.
    command: ["node", "src/worker/index.js"]
    networks: [notifications, backend-net]

  email-worker:
    build: ./app
    container_name: email-worker
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      SERVICE_NAME: email-worker
      RABBITMQ_HOST: rabbitmq
      REDISHOST: redis
      CHANNEL: email
      PORT: "3000"
      IDEMPOTENCY_ENABLED: "false"
      CLAIM_LEASE_ENABLED: "false"
    command: ["node", "src/worker/index.js"]
    networks: [notifications, backend-net]

  # Browser dashboard to fire lab scenarios. Proxies server-side to the
  # producer over the Docker network — the producer is never exposed to the host.
  dashboard:
    build: ./web
    container_name: dashboard
    restart: unless-stopped
    depends_on:
      - producer
    environment:
      PRODUCER_URL: http://producer:3000
      HOSTNAME: "0.0.0.0"
    networks: [notifications]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notifications.rule=Host(`notifications.sanattudu.tech`)"
      - "traefik.http.routers.notifications.entrypoints=websecure"
      - "traefik.http.routers.notifications.tls=true"
      - "traefik.http.routers.notifications.tls.certresolver=letsencrypt"
      - "traefik.http.services.notifications.loadbalancer.server.port=3000"

networks:
  notifications:
  backend-net:
    external: true

volumes:
  rabbitmq_data: